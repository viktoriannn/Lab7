name: Ex1

on: 
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix: 
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build project
        run: dotnet build ./ClassForm/ClassForm.sln --configuration ${{ matrix.configuration }}
      - name: Run tests
        run: dotnet test ./ClassForm/TUnitTest/TUnitTest.csproj --configuration ${{ matrix.configuration }} --no-build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassForm-${{ matrix.configuration }}
          path: ./ClassForm/ClassForm/bin/${{ matrix.configuration }}/
          if-no-files-found: error
          retention-days: 7