name: Sequential Workflow

on: 
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build project
        run: dotnet build ./ClassForm/ClassForm.sln --configuration Release

  test:
    needs: build
    runs-on: windows-latest
    strategy:
      matrix: 
        configuration: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run tests
        run: dotnet test ./ClassForm/TUnitTest/TUnitTest.csproj --configuration ${{ matrix.configuration }}

  analyze:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run code analysis
        run: dotnet tool install -g dotnet-format && dotnet format ./ClassForm/ClassForm.sln
