name: Ex2

on: 
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build project
        run: dotnet build ./ClassForm/ClassForm.sln --configuration Release
  test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run tests
        run:  dotnet test ./ClassForm/TUnitTest/TUnitTest.csproj --configuration Release --collect:"XPlat Code Coverage"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./ClassForm/TUnitTest/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7


